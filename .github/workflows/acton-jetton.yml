name: V COIN TON Acton Jetton checks

on:
  push:
    branches: [main, "security/**"]
    paths:
      - "contracts/acton/**"
      - ".github/workflows/acton-jetton.yml"
  pull_request:
    paths:
      - "contracts/acton/**"
      - ".github/workflows/acton-jetton.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acton-jetton:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/acton
    steps:
      - uses: actions/checkout@v4
      - name: Install Acton
        shell: bash
        run: |
          curl -LsSf https://github.com/ton-blockchain/acton/releases/latest/download/acton-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: acton --version
      - name: Build Jetton contracts
        run: acton build
      - name: Run Jetton contract integration tests
        run: acton test jetton-v2.1/tests vcoin-policy/tests
      - name: Static checks
        run: acton check
      - name: Formatting check
        run: acton fmt --check
