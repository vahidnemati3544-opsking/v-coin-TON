name: V COIN TON Backend CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/mining/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/mining/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vcoin_test
          POSTGRES_PASSWORD: vcoin_test_password
          POSTGRES_DB: vcoin_ton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcoin_test -d vcoin_ton_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vcoin_test:vcoin_test_password@localhost:5432/vcoin_ton_test
      TEST_DATABASE_URL: postgresql://vcoin_test:vcoin_test_password@localhost:5432/vcoin_ton_test
    defaults:
      run:
        working-directory: contracts/mining/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Initialize PostgreSQL schema and migrations
        run: npm run db:setup
      - name: Run backend unit and integration tests
        run: npm test
