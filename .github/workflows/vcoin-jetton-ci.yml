name: VCOIN TON Jetton CI

on:
  push:
    branches:
      - feature/growth-dashboard-backend
    paths:
      - "contracts/jetton/acton/**"
      - ".github/workflows/vcoin-jetton-ci.yml"
  pull_request:
    paths:
      - "contracts/jetton/acton/**"
      - ".github/workflows/vcoin-jetton-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate wrappers
        working-directory: contracts/jetton/acton
        run: docker run --rm -v "$PWD":/workspace -w /workspace ghcr.io/ton-blockchain/acton:1.2.1 run generate-wrappers
      - name: Compile contracts
        working-directory: contracts/jetton/acton
        run: docker run --rm -v "$PWD":/workspace -w /workspace ghcr.io/ton-blockchain/acton:1.2.1 build
      - name: Run emulator tests
        working-directory: contracts/jetton/acton
        run: docker run --rm -v "$PWD":/workspace -w /workspace ghcr.io/ton-blockchain/acton:1.2.1 test tests
