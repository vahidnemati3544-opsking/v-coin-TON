name: V COIN TON Jetton verification

on:
  push:
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton-verify.yml"
      - "issuer/**"
  pull_request:
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton-verify.yml"
  workflow_dispatch:

concurrency:
  group: vcoin-jetton-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/jetton
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify committed lockfile is current
        run: git diff --exit-code -- package-lock.json
      - name: Install from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Capture dependency audit report
        run: npm audit --json > npm-audit-report.json || true
      - name: Enforce zero moderate, high, or critical dependency advisories
        run: npm audit --audit-level=moderate
      - name: Compile Tact contracts
        run: npm run build
      - name: Build immutable TEP-64 metadata content cell
        run: node scripts/build-metadata-cell.cjs "https://raw.githubusercontent.com/vahidnemati3544-opsking/v-coin-TON/e17bcb9d82ea182bff3358b9fac6b5fa25c166ee/contracts/jetton/metadata.json"
      - name: Derive deterministic Mainnet Master and five Jetton Wallet addresses
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm run derive:addresses
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('build/mainnet-address-derivation.json', 'utf8'));
          if (!result.master.address || !result.master.state_init_hash || result.jetton_wallets.length !== 5) throw new Error('Deterministic Master / five-wallet derivation output is incomplete.');
          if (new Set(result.jetton_wallets.map((item) => item.jetton_wallet_address)).size !== 5) throw new Error('Derived Jetton Wallet addresses are not pairwise unique.');
          if (result.deployment_authorized !== false || result.mainnet_authorized !== false || result.transaction_created !== false || result.transaction_signed !== false || result.transaction_broadcast !== false) throw new Error('Address derivation must remain offline and unauthorized.');
          console.log('Master StateInit and all five Jetton Wallet addresses derived; no transaction created or authorized.');
          NODE
      - name: Reconcile reported and exact-build Master addresses plus Founder fee wallet (read-only Mainnet query)
        run: npm run reconcile:mainnet-state
      - name: Enforce local Sandbox-only simulation policy
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('deployment.config.template.json', 'utf8'));
          const policy = config.network_policy || {};
          if (policy.target_network !== 'mainnet' || policy.local_sandbox_only_for_simulation !== true) throw new Error('Mainnet production / local Sandbox-only policy is required.');
          if (policy.testnet_deployment_authorized !== false || policy.testnet_transactions_authorized !== false) throw new Error('Public Testnet operations must remain unauthorized.');
          if (config.deployment_authorized !== false || config.mainnet_authorized !== false) throw new Error('Mainnet deployment and transaction authorization must remain disabled.');
          const generated = fs.readdirSync('build');
          if (generated.some((name) => /testnet-rehearsal|\.testnet\./i.test(name))) throw new Error('Public Testnet rehearsal artifacts must not be generated.');
          console.log('Mainnet target and local TON Sandbox-only simulation policy validated; no public Testnet artifacts generated.');
          NODE
      - name: Block obsolete direct-mint Mainnet transaction preview
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const obsolete = [
            'build/mainnet-deployment-preview.json',
            'build/VCoinMaster.state-init.boc',
          ];
          for (const file of obsolete) {
            if (fs.existsSync(file)) throw new Error('Obsolete Mainnet transaction artifact must not be generated: ' + file);
          }
          const walletArtifacts = fs.readdirSync('build').filter((name) => /^jetton-wallet-.*\.state-init\.boc$/.test(name));
          if (walletArtifacts.length) throw new Error('Obsolete direct-mint Jetton wallet StateInit artifacts must not be generated.');
          const planner = fs.readFileSync('scripts/prepare-mainnet-deployment.ts', 'utf8');
          if (!planner.includes('DISABLED — Mainnet transaction planning is intentionally blocked')) throw new Error('Mainnet transaction planner must remain disabled pending release gates.');
          const workflow = fs.readFileSync('../../.github/workflows/vcoin-jetton-verify.yml', 'utf8');
          const legacyPlannerInvocation = 'npx tsx scripts/' + 'prepare-mainnet-deployment.ts';
          if (workflow.includes(legacyPlannerInvocation)) throw new Error('CI must not execute the legacy direct-mint transaction planner.');
          console.log('Legacy direct-mint transaction preview generation is disabled pending Founder-first contract implementation.');
          NODE
      - name: Validate Founder-first allocation manifest and authorization hold
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('deployment.config.template.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('allocation-manifest.template.json', 'utf8'));
          const founder = config.allocation_wallets.founder;
          const expected = {
            founder: '420000000000000',
            mining_reserve: '1050000000000000',
            treasury: '210000000000000',
            liquidity_market: '210000000000000',
            ecosystem_marketing: '210000000000000',
          };
          const actualTotal = Object.values(config.allocation_base_units).reduce((sum, value) => sum + BigInt(value), 0n);
          if (actualTotal !== 2100000000000000n || config.initial_supply_base_units !== '2100000000000000') throw new Error('Fixed 2.1B supply accounting mismatch.');
          for (const [role, amount] of Object.entries(expected)) {
            if (config.allocation_base_units[role] !== amount) throw new Error('Unexpected allocation amount for ' + role);
          }
          const owners = Object.values(config.allocation_wallets);
          if (owners.length !== 5 || new Set(owners).size !== 5) throw new Error('Exactly five unique owner allocation addresses are required.');
          if (config.operational_fee_wallet.owner_provided_address !== founder) throw new Error('GAS & OPERATIONS must be the Founder wallet.');
          if (manifest.founder_wallet_candidate !== founder || manifest.gas_operations_wallet.address !== founder) throw new Error('Manifest Founder/GAS address mismatch.');
          if (manifest.gas_operations_wallet.is_separate_wallet !== false) throw new Error('A separate GAS wallet is not part of the approved design.');
          if (manifest.transfers.length !== 5) throw new Error('Manifest must contain exactly five final allocation rows.');
          for (const row of manifest.transfers) {
            if (row.destination !== config.allocation_wallets[row.allocation]) throw new Error('Manifest destination mismatch for ' + row.allocation);
            if (row.base_units !== config.allocation_base_units[row.allocation]) throw new Error('Manifest allocation mismatch for ' + row.allocation);
          }
          if (!manifest.status.includes('HOLD / NO-GO') || !manifest.preview_status.includes('HOLD / NO-GO')) throw new Error('Manifest must remain HOLD / NO-GO.');
          if (config.deployment_authorized !== false || config.mainnet_authorized !== false || manifest.founder_confirmed_release_intent.mainnet_transaction_authorized !== false) throw new Error('Mainnet authorization flags must remain false.');
          const receiptStages = [
            ['420000000','420000000000000'],
            ['1050000000','1050000000000000'],
            ['210000000','210000000000000'],
            ['210000000','210000000000000'],
            ['210000000','210000000000000'],
          ];
          if (config.initial_receipt.installments.length !== 5 || manifest.initial_receipt.installments.length !== 5) throw new Error('Exactly five receipt stages must be configured.');
          for (let i = 0; i < receiptStages.length; i++) {
            const [tokens, baseUnits] = receiptStages[i];
            const c = config.initial_receipt.installments[i];
            const m = manifest.initial_receipt.installments[i];
            if (c.stage !== i + 1 || c.amount_tokens !== tokens || c.amount_base_units !== baseUnits || c.founder_authorization_required !== true) throw new Error('Deployment config stage mismatch: ' + (i + 1));
            if (m.stage !== i + 1 || m.amount_tokens !== tokens || m.amount_base_units !== baseUnits || m.requires_fresh_founder_signature !== true) throw new Error('Allocation manifest stage mismatch: ' + (i + 1));
          }
          if (config.initial_receipt.fifth_stage_requires_fresh_founder_announcement !== true || manifest.initial_receipt.stage_5_requires_fresh_founder_announcement !== true) throw new Error('Stage 5 Founder authorization gate missing.');
          if (manifest.predicted_jetton_master_address !== null || manifest.predicted_master_state_init_hash !== null || manifest.preview_source_commit !== null) throw new Error('Superseded deployment predictions must remain cleared.');
          console.log('Founder-first wallet register, allocation totals, shared Founder/GAS role, and Mainnet HOLD flags validated.');
          NODE
      - name: Run Jest tests
        run: npm test
      - name: Block release until Founder-first staged contract and Sandbox coverage exist
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/vcoin.tact', 'utf8');
          const tests = fs.readFileSync('tests/jetton-sandbox.spec.ts', 'utf8');
          const checks = {
            founderOnlyReceipt: source.includes('msg.receiver == self.owner'),
            fixedFiveStageSequence: source.includes('expectedReceiptAmount') && source.includes('next_receipt_stage'),
            pendingReceiptLock: source.includes('receipt_pending'),
            exactStageAmounts: ['VCOIN_STAGE_1','VCOIN_STAGE_2','VCOIN_STAGE_3','VCOIN_STAGE_4','VCOIN_STAGE_5'].every((name) => source.includes(name)),
            fiveCreditAcknowledgements: ['stage_1_confirmed','stage_2_confirmed','stage_3_confirmed','stage_4_confirmed','stage_5_confirmed'].every((name) => source.includes(name)),
            idempotentAcknowledgement: source.includes('msg.query_id < self.next_receipt_stage'),
            walletAckRetry: fs.readFileSync('src/jetton.tact','utf8').includes('VCoinRetryReceiptAcknowledgement'),
            stageFiveDisablesMint: source.includes('self.mintable = false'),
            exactFiveStageSandbox: tests.includes('all five exact stages are credited to Founder in sequence'),
            acknowledgementRetrySandbox: tests.includes('retry an acknowledgement without double-issuing'),
            stageOneBounceSandbox: tests.includes('natural Stage 1 bounce'),
            stageTwoBounceSandbox: tests.includes('natural Stage 2 bounce'),
            founderDistributionSandbox: tests.includes('distribute four registered allocations only after all five receipts'),
          };
          const missing = Object.entries(checks).filter(([, passed]) => !passed).map(([name]) => name);
          if (missing.length) {
            throw new Error(
              'Mainnet release remains blocked: the current VCoinMaster lacks required Founder-first receipt/acknowledgement behavior or matching Sandbox cases. Missing: ' + missing.join(', ')
            );
          }
          console.log('Founder-first receipt, credit acknowledgements, exact-remainder Stage 2, bounce and distribution Sandbox markers are present.');
          NODE
      - name: Preserve complete V COIN–TON source snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vcoin-ton-full-source-${{ github.sha }}
          path: |
            .github/
            contracts/
            docs/
            issuer/
            README.md
            BACKEND-ARCHITECTURE.md
            DEPLOYMENT_ARCHITECTURE.md
            !**/node_modules/**
            !contracts/jetton/build/**
            !contracts/jetton/build-test/**
            !contracts/jetton/npm-audit-report.json
            !**/.env
            contracts/mining/backend/.env.example
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Prepare and validate root-level Pages site assets
        run: |
          python ../../issuer/generate_icon.py
          cat > ../../issuer/deployment-preview.json <<'JSON'
          {
            "project": "V COIN – TON",
            "status": "HOLD / NO-GO",
            "network": "mainnet",
            "fixed_supply_tokens": "2100000000",
            "decimals": 6,
            "initial_receipt": {
              "model": "Founder-first five-stage receipt",
              "founder_mainnet_wallet": "UQBh9jVKAypc4TrbFx2jsVB2EI1ONChg22zDputisQjENQOT",
              "stages": [
                {"stage":1,"amount_tokens":"420000000","requires_fresh_founder_signature":true},
                {"stage":2,"amount_tokens":"1050000000","requires_fresh_founder_signature":true},
                {"stage":3,"amount_tokens":"210000000","requires_fresh_founder_signature":true},
                {"stage":4,"amount_tokens":"210000000","requires_fresh_founder_signature":true},
                {"stage":5,"amount_tokens":"210000000","requires_fresh_founder_signature":true}
              ]
            },
            "legacy_direct_mint_preview_suppressed": true,
            "transaction_payloads": null,
            "broadcasted": false,
            "deployment_authorized": false,
            "mainnet_authorized": false
          }
          JSON
          cp assets/vcoin-canonical-logo.jpg ../../issuer/vcoin-canonical-logo.jpg
          touch ../../issuer/.nojekyll
          test -s ../../issuer/index.html
          test -s ../../issuer/tonconnect-manifest.json
          test -s ../../issuer/deployment-preview.json
          test -s ../../issuer/icon-180.png
          test -s ../../issuer/vcoin-canonical-logo.jpg
          test -f ../../issuer/.nojekyll
          echo "Verified Pages artifact entry files at issuer/ root."
      - name: Validate read-only Founder-first release status page
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('../../issuer/index.html', 'utf8');
          const preview = JSON.parse(fs.readFileSync('../../issuer/deployment-preview.json', 'utf8'));
          if (preview.status !== 'HOLD / NO-GO' || preview.transaction_payloads !== null || preview.legacy_direct_mint_preview_suppressed !== true) throw new Error('Public deployment preview must be sanitized and read-only');
          const publicStages = ['420000000','1050000000','210000000','210000000','210000000'];
          if (preview.initial_receipt.model !== 'Founder-first five-stage receipt' || preview.initial_receipt.stages.length !== 5) throw new Error('Public preview must expose exactly five approved receipt stages.');
          preview.initial_receipt.stages.forEach((stage, i) => { if (stage.stage !== i + 1 || stage.amount_tokens !== publicStages[i] || stage.requires_fresh_founder_signature !== true) throw new Error('Public preview receipt stage mismatch: ' + (i + 1)); });
          if (!html.includes('MAINNET RELEASE — HOLD / NO-GO')) throw new Error('Mainnet hold banner is required');
          if (!html.includes('Stage 2: 1,050,000,000 VCOIN') || !html.includes('Stage 5: 210,000,000 VCOIN')) throw new Error('Five-stage Founder receipt display is missing');
          if (!html.includes('2,100,000,000 VCOIN')) throw new Error('Fixed supply display is missing');
          if (html.includes('TON_CONNECT_UI') || html.includes('sendTransaction(')) throw new Error('Read-only status page must not create or send transactions');
          if (html.includes('issuance_transactions')) throw new Error('Legacy direct-mint issuance UI must be removed');
          console.log('Read-only Founder-first Mainnet hold page validated.');
          NODE
      - name: Upload TonConnect issuer site
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: issuer/
      - name: Preserve exact-head release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcoin-jetton-release-${{ github.sha }}
          path: |
            contracts/jetton/build/
            contracts/jetton/build-test/
            contracts/jetton/package-lock.json
            contracts/jetton/npm-audit-report.json
          if-no-files-found: warn
          retention-days: 30

  hash-reproduction:
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/jetton
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked toolchain in a fresh runner
        run: npm ci --no-audit --no-fund
      - name: Download first-run compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: vcoin-jetton-release-${{ github.sha }}
          path: /tmp/vcoin-first-build
      - name: Rebuild Tact contracts in clean runner
        run: npm run build
      - name: Rebuild pinned TEP-64 content cell
        run: node scripts/build-metadata-cell.cjs "https://raw.githubusercontent.com/vahidnemati3544-opsking/v-coin-TON/e17bcb9d82ea182bff3358b9fac6b5fa25c166ee/contracts/jetton/metadata.json"
      - name: Independently derive Master and five Jetton Wallet hashes
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run derive:addresses
      - name: Compare clean-room outputs with first runner
        run: |
          set -euo pipefail
          diff -u /tmp/vcoin-first-build/build/mainnet-address-derivation.json build/mainnet-address-derivation.json
          cmp /tmp/vcoin-first-build/build/VCoinMaster_VCoinMaster.code.boc build/VCoinMaster_VCoinMaster.code.boc
          cmp /tmp/vcoin-first-build/build/VCoinMaster_VCoinJettonWallet.code.boc build/VCoinMaster_VCoinJettonWallet.code.boc
          cmp /tmp/vcoin-first-build/build/VCoinMaster.content.boc build/VCoinMaster.content.boc
          echo "Clean-room Tact build, metadata cell, Master StateInit, and five Jetton Wallet derivations match byte-for-byte."
      - name: Preserve clean-room hash report
        uses: actions/upload-artifact@v4
        with:
          name: vcoin-clean-room-hashes-${{ github.sha }}
          path: contracts/jetton/build/mainnet-address-derivation.json
          if-no-files-found: error
          retention-days: 30
  deploy-issuer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, hash-reproduction]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing GitHub Pages site
        # The repository owner must enable Pages once in Settings > Pages
        # and select "GitHub Actions" as the build and deployment source.
        # GITHUB_TOKEN can deploy to an existing Pages site but cannot create
        # the repository's Pages site when Pages has never been enabled.
        uses: actions/configure-pages@v5
      - name: Deploy TonConnect issuer
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages endpoints
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}/"
          for path in index.html tonconnect-manifest.json deployment-preview.json icon-180.png vcoin-canonical-logo.jpg; do
            echo "Checking ${base}${path}"
            curl --fail --silent --show-error --location \
              --retry 20 --retry-all-errors --retry-delay 10 --max-time 20 \
              "${base}${path}" -o "/tmp/vcoin-pages-${path}"
            test -s "/tmp/vcoin-pages-${path}"
          done
          grep -q "V COIN" /tmp/vcoin-pages-index.html
          echo "GitHub Pages returned HTTP success for all required issuer assets."
