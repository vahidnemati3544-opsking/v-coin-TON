name: V COIN TON Jetton verification

on:
  push:
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton-verify.yml"
      - "issuer/**"
  pull_request:
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton-verify.yml"
  workflow_dispatch:

concurrency:
  group: vcoin-jetton-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/jetton
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Capture dependency audit report
        run: npm audit --json > npm-audit-report.json || true
      - name: Enforce zero moderate, high, or critical dependency advisories
        run: npm audit --audit-level=moderate
      - name: Compile Tact contracts
        run: npm run build
      - name: Build immutable TEP-64 metadata content cell
        run: node scripts/build-metadata-cell.cjs "https://raw.githubusercontent.com/vahidnemati3544-opsking/v-coin-TON/9d3364b767aecdf0df038b9bf600435f6662c225/contracts/jetton/metadata.json"
      - name: Generate unsigned Mainnet deployment preview
        run: npx tsx scripts/prepare-mainnet-deployment.ts
      - name: Run Jest tests
        run: npm test
      - name: Preserve complete V COIN–TON source snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vcoin-ton-full-source-${{ github.sha }}
          path: |
            .github/
            contracts/
            docs/
            issuer/
            README.md
            BACKEND-ARCHITECTURE.md
            DEPLOYMENT_ARCHITECTURE.md
            !**/node_modules/**
            !contracts/jetton/build/**
            !contracts/jetton/build-test/**
            !**/.env
          if-no-files-found: error
          retention-days: 30
      - name: Prepare TonConnect issuer site assets
        run: |
          python ../../issuer/generate_icon.py
          cp build/mainnet-deployment-preview.json ../../issuer/deployment-preview.json
      - name: Validate TonConnect issuer syntax and transaction sequencing guards
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('../../issuer/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1]);
          if (scripts.length !== 1) throw new Error('Expected exactly one inline issuer script');
          new Function(scripts[0]);
          const required = [
            "walletRole() !== 'founder-operator'",
            "wallet.account.chain !== '-239'",
            "button.dataset.sequence",
            "nextAllocationIndex",
            "verifyInput.disabled = false",
            "deployButton.dataset.submitted = 'true'",
            "preview.signing.signer_raw",
            "preview.signing.allocation_issuance_signer_raw",
            "tonToNano(preview.unsigned_deploy_message.attached_ton)",
            "preview.unsigned_deploy_message.network_fee_quote_required"
          ];
          for (const guard of required) {
            if (!html.includes(guard)) throw new Error('Missing issuer safety guard: ' + guard);
          }
          if (html.includes("walletRole() !== 'gas'")) throw new Error('Obsolete separate GAS signer guard remains');
          if (html.includes("amount: '750000000'")) throw new Error('Hard-coded deployment TON value must not override the release preview');
          if (html.includes("amount: '1000000000'")) throw new Error('Hard-coded deployment TON value must not override the release preview');
          console.log('TonConnect issuer syntax and safety guards passed.');
          NODE
      - name: Commit generated dependency lockfile when missing or changed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The issuer preview is generated for the Pages artifact, not committed here.
          # Avoids concurrent CI runs racing on source_commit-specific preview JSON.
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current."
          else
            git commit -m "build(jetton): commit reproducible npm lockfile"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload TonConnect issuer site
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: issuer/
      - name: Preserve exact-head release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcoin-jetton-release-${{ github.sha }}
          path: |
            contracts/jetton/build/
            contracts/jetton/build-test/
            contracts/jetton/package-lock.json
            contracts/jetton/npm-audit-report.json
          if-no-files-found: warn
          retention-days: 30

  deploy-issuer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing GitHub Pages site
        # The repository owner must enable Pages once in Settings > Pages
        # and select "GitHub Actions" as the build and deployment source.
        # GITHUB_TOKEN can deploy to an existing Pages site but cannot create
        # the repository's Pages site when Pages has never been enabled.
        uses: actions/configure-pages@v5
      - name: Deploy TonConnect issuer
        id: deployment
        uses: actions/deploy-pages@v4
