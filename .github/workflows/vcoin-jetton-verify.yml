name: V COIN TON Jetton verification

on:
  push:
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton-verify.yml"
      - "issuer/**"
  pull_request:
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton-verify.yml"
  workflow_dispatch:

concurrency:
  group: vcoin-jetton-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/jetton
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify committed lockfile is current
        run: git diff --exit-code -- package-lock.json
      - name: Install from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Capture dependency audit report
        run: npm audit --json > npm-audit-report.json || true
      - name: Enforce zero moderate, high, or critical dependency advisories
        run: npm audit --audit-level=moderate
      - name: Compile Tact contracts
        run: npm run build
      - name: Build immutable TEP-64 metadata content cell
        run: node scripts/build-metadata-cell.cjs "https://raw.githubusercontent.com/vahidnemati3544-opsking/v-coin-TON/e17bcb9d82ea182bff3358b9fac6b5fa25c166ee/contracts/jetton/metadata.json"
      - name: Block obsolete direct-mint Mainnet transaction preview
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const obsolete = [
            'build/mainnet-deployment-preview.json',
            'build/VCoinMaster.state-init.boc',
          ];
          for (const file of obsolete) {
            if (fs.existsSync(file)) throw new Error('Obsolete Mainnet transaction artifact must not be generated: ' + file);
          }
          const walletArtifacts = fs.readdirSync('build').filter((name) => /^jetton-wallet-.*\.state-init\.boc$/.test(name));
          if (walletArtifacts.length) throw new Error('Obsolete direct-mint Jetton wallet StateInit artifacts must not be generated.');
          const planner = fs.readFileSync('scripts/prepare-mainnet-deployment.ts', 'utf8');
          if (!planner.includes('DISABLED: legacy direct-mint Mainnet preview')) throw new Error('Legacy transaction planner must remain disabled until Founder-first implementation is verified.');
          const workflow = fs.readFileSync('../../.github/workflows/vcoin-jetton-verify.yml', 'utf8');
          if (workflow.includes('npx tsx scripts/prepare-mainnet-deployment.ts')) throw new Error('CI must not execute the legacy direct-mint transaction planner.');
          console.log('Legacy direct-mint transaction preview generation is disabled pending Founder-first contract implementation.');
          NODE
      - name: Validate Founder-first allocation manifest and authorization hold
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('deployment.config.template.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('allocation-manifest.template.json', 'utf8'));
          const founder = config.allocation_wallets.founder;
          const expected = {
            founder: '420000000000000',
            mining_reserve: '1050000000000000',
            treasury: '210000000000000',
            liquidity_market: '210000000000000',
            ecosystem_marketing: '210000000000000',
          };
          const actualTotal = Object.values(config.allocation_base_units).reduce((sum, value) => sum + BigInt(value), 0n);
          if (actualTotal !== 2100000000000000n || config.initial_supply_base_units !== '2100000000000000') throw new Error('Fixed 2.1B supply accounting mismatch.');
          for (const [role, amount] of Object.entries(expected)) {
            if (config.allocation_base_units[role] !== amount) throw new Error('Unexpected allocation amount for ' + role);
          }
          const owners = Object.values(config.allocation_wallets);
          if (owners.length !== 5 || new Set(owners).size !== 5) throw new Error('Exactly five unique owner allocation addresses are required.');
          if (config.operational_fee_wallet.owner_provided_address !== founder) throw new Error('GAS & OPERATIONS must be the Founder wallet.');
          if (manifest.founder_wallet_candidate !== founder || manifest.gas_operations_wallet.address !== founder) throw new Error('Manifest Founder/GAS address mismatch.');
          if (manifest.gas_operations_wallet.is_separate_wallet !== false) throw new Error('A separate GAS wallet is not part of the approved design.');
          if (manifest.transfers.length !== 5) throw new Error('Manifest must contain exactly five final allocation rows.');
          for (const row of manifest.transfers) {
            if (row.destination !== config.allocation_wallets[row.allocation]) throw new Error('Manifest destination mismatch for ' + row.allocation);
            if (row.base_units !== config.allocation_base_units[row.allocation]) throw new Error('Manifest allocation mismatch for ' + row.allocation);
          }
          if (!manifest.status.includes('HOLD / NO-GO') || !manifest.preview_status.includes('HOLD / NO-GO')) throw new Error('Manifest must remain HOLD / NO-GO.');
          if (config.deployment_authorized !== false || config.mainnet_authorized !== false || manifest.founder_confirmed_release_intent.mainnet_transaction_authorized !== false) throw new Error('Mainnet authorization flags must remain false.');
          if (config.initial_receipt.installments[0].amount_tokens !== null || config.initial_receipt.installments[1].amount_tokens !== null || config.initial_receipt.second_stage_requires_fresh_founder_announcement !== true) throw new Error('Unapproved staged receipt amounts or authorization state found.');
          if (manifest.initial_receipt.installments[0].amount_tokens !== null || manifest.initial_receipt.installments[1].amount_tokens !== null || manifest.initial_receipt.stage_2_requires_fresh_founder_announcement !== true) throw new Error('Manifest staged receipt amounts or authorization state mismatch.');
          if (manifest.predicted_jetton_master_address !== null || manifest.predicted_master_state_init_hash !== null || manifest.preview_source_commit !== null) throw new Error('Superseded deployment predictions must remain cleared.');
          console.log('Founder-first wallet register, allocation totals, shared Founder/GAS role, and Mainnet HOLD flags validated.');
          NODE
      - name: Run Jest tests
        run: npm test
      - name: Preserve complete V COIN–TON source snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vcoin-ton-full-source-${{ github.sha }}
          path: |
            .github/
            contracts/
            docs/
            issuer/
            README.md
            BACKEND-ARCHITECTURE.md
            DEPLOYMENT_ARCHITECTURE.md
            !**/node_modules/**
            !contracts/jetton/build/**
            !contracts/jetton/build-test/**
            !contracts/jetton/npm-audit-report.json
            !**/.env
            contracts/mining/backend/.env.example
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Prepare and validate root-level Pages site assets
        run: |
          python ../../issuer/generate_icon.py
          cat > ../../issuer/deployment-preview.json <<'JSON'
          {
            "project": "V COIN – TON",
            "status": "HOLD / NO-GO",
            "network": "mainnet",
            "fixed_supply_tokens": "2100000000",
            "decimals": 6,
            "initial_receipt": {
              "model": "Founder-first two-stage receipt",
              "founder_mainnet_wallet": "UQBh9jVKAypc4TrbFx2jsVB2EI1ONChg22zDputisQjENQOT",
              "stage_1_amount_tokens": null,
              "stage_2_amount_tokens": null,
              "stage_2_requires_fresh_founder_signature": true
            },
            "legacy_direct_mint_preview_suppressed": true,
            "transaction_payloads": null,
            "broadcasted": false,
            "deployment_authorized": false,
            "mainnet_authorized": false
          }
          JSON
          cp assets/vcoin-canonical-logo.jpg ../../issuer/vcoin-canonical-logo.jpg
          touch ../../issuer/.nojekyll
          test -s ../../issuer/index.html
          test -s ../../issuer/tonconnect-manifest.json
          test -s ../../issuer/deployment-preview.json
          test -s ../../issuer/icon-180.png
          test -s ../../issuer/vcoin-canonical-logo.jpg
          test -f ../../issuer/.nojekyll
          echo "Verified Pages artifact entry files at issuer/ root."
      - name: Validate read-only Founder-first release status page
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('../../issuer/index.html', 'utf8');
          const preview = JSON.parse(fs.readFileSync('../../issuer/deployment-preview.json', 'utf8'));
          if (preview.status !== 'HOLD / NO-GO' || preview.transaction_payloads !== null || preview.legacy_direct_mint_preview_suppressed !== true) throw new Error('Public deployment preview must be sanitized and read-only');
          if (!html.includes('MAINNET RELEASE — HOLD / NO-GO')) throw new Error('Mainnet hold banner is required');
          if (!html.includes('Stage 2: a separate, fresh Founder signature')) throw new Error('Stage 2 fresh-signature guard is missing');
          if (!html.includes('2,100,000,000 VCOIN')) throw new Error('Fixed supply display is missing');
          if (html.includes('TON_CONNECT_UI') || html.includes('sendTransaction(')) throw new Error('Read-only status page must not create or send transactions');
          if (html.includes('issuance_transactions')) throw new Error('Legacy direct-mint issuance UI must be removed');
          console.log('Read-only Founder-first Mainnet hold page validated.');
          NODE
      - name: Upload TonConnect issuer site
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: issuer/
      - name: Preserve exact-head release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcoin-jetton-release-${{ github.sha }}
          path: |
            contracts/jetton/build/
            contracts/jetton/build-test/
            contracts/jetton/package-lock.json
            contracts/jetton/npm-audit-report.json
          if-no-files-found: warn
          retention-days: 30

  deploy-issuer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing GitHub Pages site
        # The repository owner must enable Pages once in Settings > Pages
        # and select "GitHub Actions" as the build and deployment source.
        # GITHUB_TOKEN can deploy to an existing Pages site but cannot create
        # the repository's Pages site when Pages has never been enabled.
        uses: actions/configure-pages@v5
      - name: Deploy TonConnect issuer
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages endpoints
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}/"
          for path in index.html tonconnect-manifest.json deployment-preview.json icon-180.png vcoin-canonical-logo.jpg; do
            echo "Checking ${base}${path}"
            curl --fail --silent --show-error --location \
              --retry 20 --retry-all-errors --retry-delay 10 --max-time 20 \
              "${base}${path}" -o "/tmp/vcoin-pages-${path}"
            test -s "/tmp/vcoin-pages-${path}"
          done
          grep -q "V COIN" /tmp/vcoin-pages-index.html
          echo "GitHub Pages returned HTTP success for all required issuer assets."
