name: VCOIN TON Jetton
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton.yml"
      - "docs/JETTON_DEPLOYMENT_INVENTORY.md"
  pull_request:
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton.yml"
      - "docs/JETTON_DEPLOYMENT_INVENTORY.md"
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/jetton
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/jetton/package.json
      - run: npm ci
      - name: Verify pinned public TEP-64 metadata and canonical PNG
        env:
          VCOIN_METADATA_URL: https://raw.githubusercontent.com/vahidnemati3544-opsking/v-coin-TON/d67f2549dfba8876cd4b0becc2bc8573bcc10c57/contracts/jetton/metadata.json
        run: npm run verify:metadata
      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const r=require('./npm-audit-report.json'); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities, vulnerabilities:r.vulnerabilities}, null, 2))"
      - run: npm run build
      - name: Type-check offline Mainnet artifact generator
        run: npx tsc -p tsconfig.deploy.json
      - name: Smoke-test deterministic offline StateInit generation (no network/signing)
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node build-js/deploy/prepare-mainnet.js --network mainnet --owner UQAdW09EvIesUXt9jzLq1T32O0351TaczwWJQLGGmw4aWrzy --metadata-uri https://example.invalid/vcoin-metadata.json --source-commit "$SOURCE_COMMIT" --out /tmp/vcoin-predeploy-a
          node build-js/deploy/prepare-mainnet.js --network mainnet --owner UQAdW09EvIesUXt9jzLq1T32O0351TaczwWJQLGGmw4aWrzy --metadata-uri https://example.invalid/vcoin-metadata.json --source-commit "$SOURCE_COMMIT" --out /tmp/vcoin-predeploy-b
          cmp /tmp/vcoin-predeploy-a/state-init.boc /tmp/vcoin-predeploy-b/state-init.boc
          cmp /tmp/vcoin-predeploy-a/manifest.json /tmp/vcoin-predeploy-b/manifest.json
      - run: npm test
      - name: Enforce dependency security gate
        run: npm audit --audit-level=high
      - name: Upload dependency lockfile for repository commit
        if: always() && hashFiles('contracts/jetton/package-lock.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vcoin-jetton-test-lockfile
          path: contracts/jetton/package-lock.json
          if-no-files-found: error
          retention-days: 7
