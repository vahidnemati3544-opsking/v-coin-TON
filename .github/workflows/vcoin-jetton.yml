name: VCOIN TON Jetton
on:
  push:
    branches: [main]
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton.yml"
      - "docs/JETTON_DEPLOYMENT_INVENTORY.md"
  pull_request:
    paths:
      - "contracts/jetton/**"
      - ".github/workflows/vcoin-jetton.yml"
      - "docs/JETTON_DEPLOYMENT_INVENTORY.md"
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/jetton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/jetton/package.json
      - run: npm install
      - run: npm run build
      - run: npm test