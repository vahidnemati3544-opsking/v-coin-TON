name: V COIN TON Backend Checks

on:
  push:
    branches:
      - repair/backend-foundation-2026-11-17
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vcoin
          POSTGRES_PASSWORD: vcoin_test_only
          POSTGRES_DB: vcoin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcoin -d vcoin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: vcoin_test
      PGUSER: vcoin
      PGPASSWORD: vcoin_test_only
    defaults:
      run:
        working-directory: contracts/mining/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
